name: realtime-service

on:
  push:
    paths: ["realtime-service/**", ".github/workflows/realtime-service.yml"]
  pull_request:
    paths: ["realtime-service/**", ".github/workflows/realtime-service.yml"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: realtime-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Unit tests (surefire) + Testcontainers integration tests against real Kafka, Postgres and Redis (failsafe).
      - name: Build and test
        run: mvn -B verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            realtime-service/target/surefire-reports
            realtime-service/target/failsafe-reports

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: realtime-service/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: realtime-service/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: realtime-service
    steps:
      - uses: actions/checkout@v4
      # Builds the multi-stage API image and the nginx dashboard image exactly as docker compose does.
      - run: docker compose build
